<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Assistant Local Practice Quiz</title>
  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: clamp(52px, 9vh, 100px) 16px 32px;
      color-scheme: dark;
      font: 16px/1.5 Inter, system-ui, sans-serif;
      color: #f7fbff;
      background: radial-gradient(ellipse at 0% 0%, #283f85, transparent 63%),
        radial-gradient(ellipse at 95% 100%, #146263, transparent 62%),
        linear-gradient(145deg, #101831, #080f20 62%);
    }
    body > main {
      box-sizing: border-box;
      max-width: 640px;
      margin: auto;
      padding: clamp(18px, 5vw, 36px);
      border: 1px solid rgb(191 215 255 / 34%);
      border-radius: 25px;
      background: rgb(8 15 33 / 65%);
      backdrop-filter: blur(24px) saturate(135%);
      box-shadow: 0 22px 60px rgb(4 10 26 / 40%), inset 0 1px rgb(224 238 255 / 16%);
    }
    .tag { color: #acd6ff; font-size: .81rem; font-weight: 720; letter-spacing: .07em; text-transform: uppercase; }
    h1 { margin: 4px 0 12px; font-size: clamp(2rem, 6vw, 3.15rem); line-height: 1.07; letter-spacing: -.045em; }
    #progress { margin: 0 0 16px; color: #c7d4eb; font-size: .875rem; font-weight: 650; }
    #question-card {
      padding: clamp(13px, 3vw, 22px);
      border: 1px solid rgb(191 215 255 / 30%);
      border-radius: 16px;
      background: rgb(26 40 66 / 60%);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgb(4 10 26 / 24%);
    }
    #question-card h2 { margin: 0 0 14px; font-size: clamp(1.1rem, 3vw, 1.45rem); line-height: 1.3; }
    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      padding: 10px 12px;
      border: 1px solid rgb(191 215 255 / 60%);
      border-radius: 10px;
      background: rgb(4 11 27 / 64%);
      backdrop-filter: blur(12px);
      cursor: pointer;
    }
    .option input { margin: 0; accent-color: #a5f6da; }
    .option:hover { border-color: #acd6ff; }
    .option:has(input:checked) { border-color: #a5f6da; background: rgb(20 67 66 / 82%); }
    [data-practice-submit] {
      margin-top: 10px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: linear-gradient(125deg, #a5e8ff, #c2bbff);
      color: #111b33;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    [data-practice-submit]:hover:not(:disabled) { background: linear-gradient(125deg, #c0f1ff, #d3ccff); }
    [data-practice-submit]:disabled {
      background: rgb(4 11 27 / 64%);
      border: 1px dashed rgb(191 215 255 / 60%);
      color: #c7d4eb;
      cursor: not-allowed;
    }
    .option:has(input:focus-visible), [data-practice-submit]:focus-visible { outline: 2px solid #acd6ff; outline-offset: 2px; }
    #feedback { margin: 12px 0 0; min-height: 1.5em; color: #f7fbff; font-weight: 650; }
    .done { color: #a5f6da; font-weight: 700; }
    @supports not (backdrop-filter: blur(12px)) {
      body > main { background: #13213a; }
      #question-card { background: #202e47; }
    }
    @media (forced-colors: active) {
      .option:has(input:checked) { border-color: Highlight; }
      .option:has(input:focus-visible), [data-practice-submit]:focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<body>
  <main data-browser-assistant-automation="authorized" data-practice-quiz>
    <div class="tag">Authorized local practice fixture</div>
    <h1>Practice Quiz</h1>
    <p id="progress"></p>
    <section id="question-card" data-practice-question aria-live="polite"></section>
    <p id="feedback" aria-live="polite"></p>
  </main>
  <script>
    const questions = [
      { text: 'What is 6 + 7?', options: ['11', '12', '13', '14'], answer: 2 },
      { text: 'Which data structure follows FIFO?', options: ['Stack', 'Queue', 'Tree', 'Graph'], answer: 1 },
      { text: 'What is 9 × 5?', options: ['40', '45', '50', '55'], answer: 1 },
    ];
    let index = 0;
    const card = document.getElementById('question-card');
    const progress = document.getElementById('progress');
    const feedback = document.getElementById('feedback');
    function render() {
      if (index >= questions.length) {
        progress.textContent = `${questions.length} / ${questions.length} completed`;
        card.innerHTML = '<div class="done" data-practice-complete>Practice complete — all local questions finished.</div>';
        feedback.textContent = '';
        return;
      }
      const q = questions[index];
      progress.textContent = `Question ${index + 1} of ${questions.length}`;
      card.innerHTML = `<h2 data-practice-question-text>${q.text}</h2><form id="practice-form">${q.options.map((option, i) => `<label class="option" data-practice-option data-option-index="${i}"><input type="radio" name="answer" value="${i}"> <span>${String.fromCharCode(65+i)}. ${option}</span></label>`).join('')}<button type="submit" data-practice-submit disabled>Submit answer</button></form>`;
      document.querySelectorAll('input[name="answer"]').forEach(input => input.addEventListener('change', () => { document.querySelector('[data-practice-submit]').disabled = false; }));
      document.getElementById('practice-form').addEventListener('submit', event => {
        event.preventDefault();
        const selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) return;
        feedback.textContent = Number(selected.value) === q.answer ? 'Correct — loading next question…' : 'Submitted — loading next question…';
        setTimeout(() => { index += 1; render(); }, 250);
      });
    }
    render();
  </script>
</body>
</html>
