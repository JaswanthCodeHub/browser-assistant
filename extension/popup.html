<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="assistant-popup">
    <main class="popup-shell">
        <header class="popup-title">
            <span class="popup-mark" aria-hidden="true">BA</span>
            <h1>Browser Assistant</h1>
        </header>
        <section class="popup-card" aria-label="Server status">
            <div>Server <span id="server-status" role="status">Checking…</span></div>
            <p id="journal-countdown" hidden></p>
        </section>
        <section class="popup-card" aria-labelledby="popup-shortcuts">
            <h2 id="popup-shortcuts">Keyboard shortcuts</h2>
            <div class="shortcut-row"><span>Open panel</span> <kbd>`</kbd></div>
            <div class="shortcut-row"><span>Close panel</span> <kbd>]</kbd></div>
            <div class="shortcut-row"><span>Vision scan</span> <kbd>\</kbd></div>
            <div class="shortcut-row"><span>Minimal mode</span> <kbd>[</kbd></div>
            <div class="shortcut-row"><span>Fill and submit journal</span> <kbd>Alt+Shift+J</kbd></div>
            <div class="shortcut-row"><span>Start, pause or resume</span> <kbd>Alt+A</kbd></div>
        </section>
    </main>
    <script src="popup.js"></script>
</body>
</html>
