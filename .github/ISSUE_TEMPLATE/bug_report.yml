name: 🐛 Bug Report
description: Report a bug or unexpected behavior
body:
  - type: markdown
    attributes:
      value: |
        Do not include keys, private URLs, or sensitive screenshots. Thanks for taking the time to report a bug! Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Provide a clear and concise description of the bug.
      placeholder: A clear description of what the bug is...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear description of what you expected to happen...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: A clear description of what actually happened...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem. Drag and drop images here.
      placeholder: Use only redacted screenshots or synthetic practice-page content.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Chromium
        - Brave
        - Edge
        - Other
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Setup
      description: How are you running the backend?
      options:
        - Docker
        - Local Python
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the extension are you using? (Check manifest.json)
      placeholder: e.g., 2.6.6
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (logs, error messages, etc.).
      placeholder: Any additional information...
    validations:
      required: false
