name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python scripts/check_repo.py
      - run: python scripts/package_release.py
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    env:
      GROQ_API_KEY: ''
      GROQ_API_KEY_2: ''
      GROQ_API_KEY_3: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements.lock.txt
      - run: python -m pip install --require-hashes -r server/requirements.lock.txt
      - run: python test_clean.py
        working-directory: server
      - run: python -m unittest discover -p 'test*.py' -v
        working-directory: server
      - run: python scripts/smoke_backend.py
  docker:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cp server/.env.example server/.env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Verify health and practice
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/practice > /dev/null
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
