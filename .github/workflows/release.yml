name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: python scripts/check_repo.py
      - run: python -m pip install --require-hashes -r server/requirements.lock.txt
      - run: python test_clean.py
        working-directory: server
      - run: python -m unittest discover -p 'test*.py' -v
        working-directory: server
      - name: Package matching version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$RELEASE_TAG"
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/v*/*.zip
            dist/v*/*.sha256
            dist/v*/release-manifest.json
