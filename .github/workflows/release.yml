name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: python scripts/check_repo.py
      - run: python -m pip install --require-hashes -r server/requirements.lock.txt
      - run: python test_clean.py
        working-directory: server
      - run: python -m unittest discover -p 'test*.py' -v
        working-directory: server
      - name: Package matching version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Pack the tested npm release
        run: npm pack --ignore-scripts --pack-destination "dist/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/v*/*.tgz
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/v*/*.zip
            dist/v*/*.sha256
            dist/v*/release-manifest.json
  npm:
    name: Publish to npm
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish with npm Trusted Publishing
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$(npm view "browser-assistant@$version" version --prefer-online)" == "$version" ]]; then
            echo "browser-assistant@$version is already published."
          else
            npm publish "./browser-assistant-$version.tgz" --ignore-scripts
          fi
